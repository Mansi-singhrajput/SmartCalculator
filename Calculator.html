<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link rel="stylesheet" href="Calc.css">
</head>
<body>

<div class="calculator">
    <input type="text" id="display" readonly>

    <div class="buttons">
        <button onclick="clearDisplay()" class="operator">C</button>
        <button onclick="appendValue('/')">/</button>
        <button onclick="appendValue('*')">*</button>
         <button onclick="deleteLast()">⌫</button> 
        <button onclick="squareNumber()">x²</button>
         <button onclick="Modules()">%</button> 
         <button onclick="squareRoot()">√</button>
         <button onclick="appendValue('**')">xʸ</button>
         <button onclick="changeSign()">±</button>
         <button onclick="reciprocal()">1/x</button>
         <button onclick="appendValue(Math.PI)">π</button>
         <button onclick="randomNumber()">🎲</button>
         <button onclick="toggleTheme()">🌙</button>
         <!-- <div id="history"></div> -->
         <!-- <h3 id="clock"></h3> -->
         <button onclick="copyAnswer()">📋</button>
         <button onclick="sin()">sin</button>

<button onclick="cos()">cos</button>

<button onclick="tan()">tan</button>

<button onclick="log()">log</button>
        <!-- <h1 class="title">Smart Calculator</h1> -->
        <!-- <button onclick="appendValue('+')">+</button> -->
        <!-- <button onclick="appendValue('-')">-</button> cr-->
        <!-- <button onclick="appendValue('%')">%</button> cr -->
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('-')">-</button> 

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="appendValue('+')">+</button> 

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="calculate()" class="equal">=</button>

        <button onclick="appendValue('0')" class="zero">0</button>
        <button onclick="appendValue('.')">.</button>
    </div>
    <!-- <div class="calculator"> -->
<div id="history"></div> 
          <h3 id="clock"></h3> 

</div>
 

<script src="cals.js"></script>

</body>
</html>
